<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 90" fill="none">

  <!-- Round knot: two ropes (red + white) interlocked as a Hopf-link / love knot -->

  <!-- Red ring: navy outline + red interior -->
  <circle cx="50" cy="45" r="32" stroke="#1A2540" stroke-width="18" fill="none"/>
  <circle cx="50" cy="45" r="32" stroke="#E05454" stroke-width="11" fill="none"/>

  <!-- White ring: navy outline + white interior (drawn on top of red) -->
  <circle cx="100" cy="45" r="32" stroke="#1A2540" stroke-width="18" fill="none"/>
  <circle cx="100" cy="45" r="32" stroke="#FFFFFF" stroke-width="11" fill="none"/>

  <!-- Weave override: red passes OVER white at the top crossing -->
  <path d="M 64.03 16.24 A 32 32 0 0 1 81.05 37.26" stroke="#1A2540" stroke-width="18" fill="none"/>
  <path d="M 64.03 16.24 A 32 32 0 0 1 81.05 37.26" stroke="#E05454" stroke-width="11" fill="none"/>

  <!-- ARGUMENTAL wordmark -->
  <text
    x="155"
    y="63"
    font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="44"
    letter-spacing="0"
    fill="#1A2540"
  >ARGUMENTAL</text>

</svg>
