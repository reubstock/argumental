<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 100">

  <!-- LETTER A — sharp geometric -->
  <polygon points="46,2 16,94 4,98 34,6" fill="black"/>
  <polygon points="46,2 76,94 64,98 34,6" fill="black"/>
  <rect x="21" y="56" width="37" height="10" fill="black"/>

  <!-- FIGURE 1 — left person leaning toward center -->
  <circle cx="92" cy="12" r="9" fill="black"/>
  <!-- torso slightly right of head to show lean -->
  <rect x="87" y="19" width="14" height="27" rx="4" fill="black"/>
  <!-- legs flow from torso bottom -->
  <line x1="90" y1="43" x2="84" y2="84" stroke="black" stroke-width="7" stroke-linecap="round"/>
  <line x1="98" y1="43" x2="103" y2="84" stroke="black" stroke-width="7" stroke-linecap="round"/>
  <!-- right arm reaching to handshake -->
  <line x1="101" y1="27" x2="113" y2="44" stroke="black" stroke-width="7" stroke-linecap="round"/>

  <!-- FIGURE 2 — right person leaning toward center -->
  <circle cx="132" cy="12" r="9" fill="black"/>
  <!-- torso slightly left of head to show lean -->
  <rect x="123" y="19" width="14" height="27" rx="4" fill="black"/>
  <!-- legs flow from torso bottom -->
  <line x1="126" y1="43" x2="121" y2="84" stroke="black" stroke-width="7" stroke-linecap="round"/>
  <line x1="134" y1="43" x2="140" y2="84" stroke="black" stroke-width="7" stroke-linecap="round"/>
  <!-- left arm reaching to handshake -->
  <line x1="123" y1="27" x2="111" y2="44" stroke="black" stroke-width="7" stroke-linecap="round"/>

  <!-- Clasped hands — central moment of contact -->
  <circle cx="112" cy="44" r="9" fill="black"/>

</svg>
